[package]
name = "presence-light"
version = "1.1.1"
description = "A small shared presence indicator"
authors = ["Presence Light contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "presence_light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-process = "=2.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
