name: Dependency validation

on:
  push:
    branches: ["dependency-validation-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundle: deb
            args: ""
          - platform: windows-latest
            bundle: nsis
            args: ""
          - platform: macos-latest
            bundle: dmg
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux build prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev patchelf
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build the native installer
        run: pnpm tauri build --bundles ${{ matrix.bundle }} ${{ matrix.args }}
